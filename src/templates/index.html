<!doctype html>
<html>
  <head>
    <title>Каталог яктусів</title>
    <style>
      table {
        border-collapse: collapse;
        width: 80%;
        margin: auto;
      }
      th,
      td {
        border: 1px solid #444;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #eee;
      }
      .btn-search {
        padding: 8px 15px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .btn-search:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <header
      style="
        text-align: center;
        background-color: #4caf50;
        color: white;
        padding: 15px;
      "
    >
      <h2>Welcome to the Cactus Catalog</h2>
      <nav>
        <a href="/" style="margin: 0 10px; color: white; text-decoration: none"
          >Home</a
        >
        <a
          href="/about"
          style="margin: 0 10px; color: white; text-decoration: none"
          >About</a
        >
        <a
          href="/contact"
          style="margin: 0 10px; color: white; text-decoration: none"
          >Contact</a
        >
      </nav>
    </header>
    <main>
      <h1 style="text-align: center">Каталог кактусів</h1>

      <div style="text-align: center; margin-bottom: 20px">
        <input
          type="text"
          id="search-input"
          placeholder="Пошук кактусів..."
          style="
            padding: 8px;
            width: 250px;
            border-radius: 4px;
            border: 1px solid #ccc;
          "
        />
        <select
          id="sort-select"
          style="
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            margin: 0 10px;
          "
        >
          <option value="name">Сортувати за назвою</option>
          <option value="price">Сортувати за ціною</option>
        </select>
        <button class="btn-search">Знайти</button>
      </div>
      <div id="cactus-list"></div>
    </main>
    <footer
      style="text-align: center; margin-top: 20px; font-size: 14px; color: #666"
    >
      © 2026 Каталог кактусів. Всі права захищені.
    </footer>
    <script src="{{ url_for('static', filename='js/cactus.js') }}"></script>
  </body>
</html>
